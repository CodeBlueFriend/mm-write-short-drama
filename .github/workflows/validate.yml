name: validate

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile mm-write-short-drama/scripts/*.py
      - name: Install Word and render test dependencies
        run: python -m pip install -r mm-write-short-drama/scripts/requirements-word.txt
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Run project state and dependency regression
        run: python mm-write-short-drama/evals/test_p0.py
      - name: Validate committed knowledge seed in temporary copy
        run: python tests/validate_seeded_knowledge.py
      - name: Validate bundled knowledge
        run: python mm-write-short-drama/scripts/validate_knowledge.py --kb mm-write-short-drama/knowledge-base
