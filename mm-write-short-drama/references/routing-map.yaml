schemaVersion: "1.0.0"
source_modes:
  original:
    label: 原创
    required_references: [workflow.md, original-creation.md]
    required_artifacts: [00-project-brief.md, 03-original-discovery.md, 04-story-bible.md]
  adaptation:
    label: 改编
    required_references: [workflow.md, adaptation.md]
    required_artifacts: [00-project-brief.md, 01-source-index.md, 02-source-truth.md, 03-adaptation-map.md, 04-story-bible.md]
  source_remix:
    label: 素材再创作（旧项目原来源标记，不等同近期市场检索）
    required_references: [workflow.md, adaptation.md]
    required_artifacts: [00-project-brief.md, 01-source-index.md, 02-source-truth.md, 03-adaptation-map.md, 04-story-bible.md]
  market_research:
    label: 检索近期爆款后创作
