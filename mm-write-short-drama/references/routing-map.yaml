common_gates:
  - treatment_two_pass_review
  - outline_two_pass_review
  - explicit_user_confirmation_of_current_outline
  - batch_review
  - final_text_two_pass_review
  - word_staging_and_visual_qa
production_modes:
  live_action:
    label: 真人
    review_reference: production-modes.md
  ai_drama:
