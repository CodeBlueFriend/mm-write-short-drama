schemaVersion: "1.0.0"
source_modes:
  original:
    label: 自己编写（原创）
    required_references: [workflow.md, original-creation.md]
    required_artifacts: [00-project-brief.md, 03-original-discovery.md, 04-story-bible.md]
  adaptation:
    label: 已有素材改编
    required_references: [workflow.md, adaptation.md]
    required_artifacts: [00-project-brief.md, 01-source-index.md, 02-source-truth.md, 03-adaptation-map.md, 04-story-bible.md]
  source_remix:
    label: 素材再创作（旧项目原来源标记，不等同近期市场检索）
    required_references: [workflow.md, adaptation.md]
    required_artifacts: [00-project-brief.md, 01-source-index.md, 02-source-truth.md, 03-adaptation-map.md, 04-story-bible.md]
  market_research:
    label: 检索近期热门剧本后改编/再创作
    required_references: [workflow.md, source-intake.md, adaptation.md, original-creation.md]
    required_artifacts: [00-project-brief.md, source-evidence.json, 02-market-research.md, 03-story-treatment.md, 04-story-bible.md]
production_spec_intake:
  selection_order: [production_mode, source_mode, episode_duration, expected_episode_count]
  ordinary_requirements_after_source: [genre, audience, orientation]
  new_project_modes: [live_action, ai_drama]
  new_project_sources: [original, adaptation, market_research]
  storage: .drama/production-specs.json
  pending_stage: awaiting_production_specs
  evidence: [user_quote, message_ref]
  expected_episode_count: exact_or_range
  actual_plan_storage: .drama/episode-plan.json
  actual_total_episodes: state.totalEpisodes
  deviation: explain_story_reason_and_confirm_current_outline
common_gates:
  - explicit_user_production_specs
  - treatment_two_pass_review
  - outline_two_pass_review
  - explicit_user_confirmation_of_current_outline
  - batch_review
  - final_text_two_pass_review
  - word_staging_and_visual_qa
production_modes:
  live_action:
    label: 真人
    review_reference: production-modes.md
  ai_drama:
    label: AI
    review_reference: production-modes.md
  hybrid:
    label: 混合（旧项目/评估兼容，不满足新项目规格选择）
    review_reference: production-modes.md
  unspecified:
    label: 暂不限（未选择，不满足新项目规格门）
    review_reference: null
orientations:
  vertical: 竖屏
  horizontal: 横屏
  custom: 自定义
delivery_scopes:
  diagnosis: 诊断
  outline: 大纲
  episodes: 分集
  screenplay: 剧本
  review: 审核
  revision: 改写
  knowledge: 技巧入库
  unspecified: 未指定
review_modes:
  strict: 严格确认
  assisted: 辅助确认
  automatic: 自动推进
