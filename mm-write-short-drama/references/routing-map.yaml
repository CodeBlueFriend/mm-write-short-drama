    review_reference: null
orientations:
  vertical: 竖屏
  horizontal: 横屏
  custom: 自定义
delivery_scopes:
  diagnosis: 诊断
  outline: 大纲
  episodes: 分集
  screenplay: 剧本
  review: 审核
  revision: 改写
  knowledge: 技巧入库
  unspecified: 未指定
review_modes:
  strict: 严格确认
  assisted: 辅助确认
